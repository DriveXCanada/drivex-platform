# Railway build configuration (Nixpacks).
#
# Override the install phase to use `npm install` instead of the default
# `npm ci`. Vitest pulls in esbuild/rollup, whose platform-specific optional
# binaries are a known source of cross-platform `npm ci` lockfile failures
# (a lock generated on Windows can miss the Linux binary entries Railway needs).
# `npm install` respects the committed lockfile's pinned versions but installs
# the correct platform binaries without hard-failing on those gaps.
[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]
